apiVersion: v1
kind: Service
metadata:
  name: solidtime
spec:
  selector:
    app: solidtime
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: solidtime-db
spec:
  selector:
    app: solidtime-db
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
